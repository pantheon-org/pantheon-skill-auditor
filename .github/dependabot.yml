version: 2

# Keeps Cargo dependencies and the SHA-pinned GitHub Actions current. Minor and
# patch bumps are grouped into one weekly PR per ecosystem to cut review noise;
# major bumps are raised individually so breaking changes are reviewed alone.
# Ported from pantheon-org/tekhne.
#
# Cargo caveat: pahdk-core and pahdk-install are git dependencies pinned by tag in
# Cargo.toml. Dependabot cannot resolve them (dependency_file_not_resolvable), and
# that error fails the whole cargo job, so they are ignored below. Bump the tag by
# hand when pantheon-agentic-harness-dev-kit cuts a release.

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Wait 7 days after a release before opening an update PR, so a yanked or
    # compromised release has time to surface before we adopt it.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "pahdk-core"
      - dependency-name: "pahdk-install"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keeps the SHA pins in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
