# actionlint configuration, read automatically from this path.
#
# .github/workflows/release.yml is generated by cargo-dist and overwritten on
# `dist generate`, so shell style findings in its scripts cannot be fixed by
# editing it. These two shellcheck rules are ignored for that one file only;
# every other rule, and every other file, is still checked.
paths:
  .github/workflows/release.yml:
    ignore:
      # SC2086: unquoted variables in dist's scripts.
      - 'shellcheck reported issue in this script: SC2086:.+'
      # SC2129: individual redirects to one file instead of a grouped block.
      - 'shellcheck reported issue in this script: SC2129:.+'
