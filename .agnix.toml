# agnix lints the bundled skill against Claude Code's documented formats:
# frontmatter fields and values, allowed-tools names, broken links, leaked
# tool-call markup. Run: agnix -c .agnix.toml .
# CI (.github/workflows/agnix.yml) fails a pull request only on an error it
# introduces. Never run agnix with --fix: its autofixes have changed instruction
# meaning and corrupted files in testing.
# Ported from pantheon-org/tekhne.
target = "ClaudeCode"
exclude = [
  "node_modules/**",
  ".git/**",
  "target/**",
  # The base-branch checkout the pull request job lints for comparison.
  "base/**",
  # Test fixtures hold deliberately broken skills.
  "**/tests/**",
  "**/testdata/**",
  # Skill manifests, not Claude Code plugin manifests; agnix reads them as
  # plugin.json files and reports CC-PL-001/007/016 on every one.
  "**/.tekhne/**",
]

[rules]
# Other agents' rule families: the skill is linted against Claude Code.
codex = false
cursor = false
copilot = false
cline = false
gemini_md = false
kiro_agents = false
kiro_steering = false
amp_checks = false
opencode = false
roo_code = false
windsurf = false
# Portability and wording heuristics: no true positives when graded on these skills.
cross_platform = false
prompt_engineering = false
disabled_rules = [
  "AS-013",     # references deeper than one level: assets/ subfolders are the layout
  "XML-001",    # prose placeholders such as <chart> read as unclosed tags
  "CC-SK-007",  # unrestricted Bash: an opinion, not a defect
  "CC-SK-021",  # example paths such as /home/runner read as leaked identity
]
