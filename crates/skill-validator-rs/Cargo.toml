[package]
name = "skill-validator-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic, offline skill validation (structure, content, token counts) for the tekhne auditor."

# Not distributed on its own: the validator is the `validate`, `check`, `probes`
# and `analyze` subcommands of pantheon-skill-auditor. This crate keeps a thin
# wrapper binary for existing invocations, built from source only.
[package.metadata.dist]
dist = false

[lib]
name = "skill_validator_rs"
path = "src/lib.rs"

# The standalone validator gate binary (A5b). Wraps the lib API with a clap CLI,
# report rendering (text/json/markdown/annotations), and exit-code logic.
[[bin]]
name = "skill-validator-rs"
path = "src/main.rs"

[dependencies]
tiktoken-rs = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
