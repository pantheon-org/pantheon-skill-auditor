[workspace]
resolver = "2"
members = [
    "crates/skill-validator-rs",
    "crates/skill-auditor",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pantheon-org/pantheon-skill-auditor"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiktoken-rs = "0.12"
regex = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
skill-validator-rs = { path = "crates/skill-validator-rs" }
# The shared Pantheon Agentic Harness Dev Kit crates. A git tag until they are published
# to crates.io; the tag is immutable, so bump it deliberately.
pahdk-core = { git = "https://github.com/pantheon-org/pantheon-agentic-harness-dev-kit.git", tag = "v0.1.0-rc.2" }
pahdk-install = { git = "https://github.com/pantheon-org/pantheon-agentic-harness-dev-kit.git", tag = "v0.1.0-rc.2" }

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
