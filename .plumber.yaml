# Plumber configuration for GitHub Actions workflows (required by the action).
# Reduced from pantheon-org/tekhne's .plumber.yaml: only the `github` controls that
# apply to a Rust repository whose release workflow is generated by cargo-dist.
# Reference: https://github.com/getplumber/plumber/blob/main/.plumber.yaml

version: "2.0"

github:
  controls:
    pipelineMustNotLeakSecretsInConfig:
      enabled: false
    actionsMustBePinnedByCommitSha:
      enabled: true
      trustedOwners:
        - actions
        - github
    githubActionMustComeFromAuthorizedSources:
      enabled: true
      trustGithubOfficialActions: true
      trustSameOrgActions: true
      minimumStars: 0
      trustedGithubActions:
        - getplumber/plumber
        - googleapis/release-please-action # Release automation (release-please.yml)
        - peter-evans/find-comment # PR comment lookup (agnix.yml)
        - peter-evans/create-or-update-comment # PR comment upsert (agnix.yml)
    pipelineMustNotExecuteUnverifiedScripts:
      enabled: true
      trustedUrls:
        - https://github.com/axodotdev/cargo-dist/releases/download/*
        - https://sh.rustup.rs
    reusableWorkflowsMustNotInheritSecrets:
      enabled: true
    workflowMustNotExportEntireSecretsContext:
      enabled: true
    workflowMustNotInjectUserInputInScripts:
      enabled: true
    workflowMustNotWriteUntrustedContentToGitHubEnv:
      enabled: true
    workflowMustNotUseDangerousTriggers:
      enabled: true
    pullRequestTargetMustNotCheckoutHead:
      enabled: true
    workflowsMustDeclarePermissions:
      enabled: true
    workflowMustNotGrantPermissionsWriteAll:
      enabled: true
    externalRefsMustNotCollide:
      enabled: true
    actionsMustNotBeArchived:
      enabled: true
    actionRefsMustExistUpstream:
      enabled: true
    actionsMustNotCarryKnownCVEs:
      enabled: true
    pipelineMustNotEnableDebugTrace:
      enabled: true
      forbiddenVariables:
        - ACTIONS_STEP_DEBUG
        - ACTIONS_RUNNER_DEBUG
    # Branch protection is managed in the repository ruleset, not this check.
    branchMustBeProtected:
      enabled: false
